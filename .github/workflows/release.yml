name: Release Multiplatform Binaries

on:
  push:
    branches:
      - main
      - release
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to auto-detect from pubspec.yaml)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal (Intel x86_64 & Apple Silicon arm64) DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS Release (Universal arm64 + x86_64)
        run: flutter build macos --release

      - name: Package macOS Universal & Intel DMGs
        run: |
          mkdir -p build/dmg_staging
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found in build/macos/Build/Products/Release"
            exit 1
          fi
          echo "Found application bundle: $APP_PATH"
          cp -R "$APP_PATH" build/dmg_staging/
          ln -s /Applications build/dmg_staging/Applications
          hdiutil create -volname "API Lab" -srcfolder build/dmg_staging -ov -format UDZO ApiLab_macOS_Universal.dmg
          # Provide explicit Intel x86_64 and Silicon aliases
          cp ApiLab_macOS_Universal.dmg ApiLab_macOS_Intel_x86_64.dmg
          cp ApiLab_macOS_Universal.dmg ApiLab_macOS_Silicon.dmg
          # Also package portable zip
          APP_NAME=$(basename "$APP_PATH")
          (cd build/macos/Build/Products/Release && zip -r -y ../../../../../ApiLab_macOS.zip "$APP_NAME")

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: ApiLab_macOS*

  build-windows:
    name: Build Windows EXE (x86_64 / x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Release (Installer EXE & Portable ZIP)
        shell: pwsh
        run: |
          # Copy raw exe
          Copy-Item "build\windows\x64\runner\Release\api_lab.exe" -Destination "ApiLab_Windows.exe"
          # Create ZIP portable bundle
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "ApiLab_Windows_x64.zip"
          # Extract version from pubspec.yaml dynamically
          $PKG_VER = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^\+]+)').Matches.Groups[1].Value.Trim()
          Write-Host "Detected version from pubspec.yaml: $PKG_VER"
          # Compile Inno Setup installer if available passing dynamic version
          if (Test-Path "installer.iss") {
            if (Get-Command iscc -ErrorAction SilentlyContinue) {
              iscc "/DMyAppVersion=$PKG_VER" installer.iss
            } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$PKG_VER" installer.iss
            }
          }
          if (Test-Path "Output\ApiLab_Windows_Installer.exe") {
            Copy-Item "Output\ApiLab_Windows_Installer.exe" -Destination "ApiLab_Windows_Installer.exe"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            ApiLab_Windows*

  build-linux:
    name: Build Linux DEB & Portable Bundle (x86_64 / amd64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Debian (.deb) & Portable Archive
        run: |
          # 1. Create portable tar.gz bundle for x86_64 / Intel
          tar -czvf ApiLab_Linux_x64.tar.gz -C build/linux/x64/release/bundle .
          cp ApiLab_Linux_x64.tar.gz ApiLab_Linux_Intel_x86_64.tar.gz

          # 2. Prepare Debian package structure
          mkdir -p deb_dist/DEBIAN
          mkdir -p deb_dist/usr/bin
          mkdir -p deb_dist/usr/lib/api_lab
          mkdir -p deb_dist/usr/share/applications
          mkdir -p deb_dist/usr/share/icons/hicolor/256x256/apps

          cp -r build/linux/x64/release/bundle/* deb_dist/usr/lib/api_lab/
          chmod 755 deb_dist/usr/lib/api_lab/api_lab

          # Create launcher script in /usr/bin
          {
            echo '#!/bin/sh'
            echo 'exec /usr/lib/api_lab/api_lab "$@"'
          } > deb_dist/usr/bin/api_lab
          chmod 755 deb_dist/usr/bin/api_lab

          # Determine package version from tag or pubspec.yaml
          RAW_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$RAW_TAG" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          PKG_VER="${RAW_TAG#v}"
          if [ -z "$PKG_VER" ] || [ "$PKG_VER" = "main" ] || [ "$PKG_VER" = "master" ] || [ "$PKG_VER" = "release" ]; then
            PKG_VER=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d '[:space:]')
          fi
          if [ -z "$PKG_VER" ]; then
            PKG_VER="1.1.0"
          fi

          # Define package control file with runtime dependencies
          {
            echo "Package: api-lab"
            echo "Version: ${PKG_VER}"
            echo "Section: devel"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: Tonmoy <tonmoy.islam@bistasolutions.com>"
            echo "Depends: libgtk-3-0 (>= 3.0.0), libglib2.0-0 (>= 2.40.0), zenity, xdg-utils"
            echo "Description: API Lab (Intel / AMD x86_64)"
            echo " Desktop API interception, mock server, and MCP developer suite."
          } > deb_dist/DEBIAN/control

          # Define desktop launcher
          {
            echo "[Desktop Entry]"
            echo "Name=API Lab"
            echo "Comment=API Interception, Mock Server & MCP Developer Suite"
            echo "Exec=api_lab"
            echo "Icon=api_lab"
            echo "Terminal=false"
            echo "Type=Application"
            echo "Categories=Development;Utility;"
            echo "StartupNotify=true"
          } > deb_dist/usr/share/applications/api_lab.desktop

          if [ -f macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png ]; then
            cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png deb_dist/usr/share/icons/hicolor/256x256/apps/api_lab.png
          fi

          dpkg-deb --build --root-owner-group deb_dist ApiLab_Linux_amd64.deb
          cp ApiLab_Linux_amd64.deb ApiLab_Linux_Intel_x86_64.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            ApiLab_Linux*

  build-android:
    name: Build Android APK (Universal & Intel x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Android Directory
        id: check_android
        run: |
          if [ -d "android" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
            echo "Notice: Android platform directory not found. Skipping Android APK build."
          fi

      - name: Setup Java 17
        if: steps.check_android.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        if: steps.check_android.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        if: steps.check_android.outputs.present == 'true'
        run: flutter pub get

      - name: Build Android APK (Fat & Split ABIs)
        if: steps.check_android.outputs.present == 'true'
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Copy & Name APKs
        if: steps.check_android.outputs.present == 'true'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ApiLab_Android.apk
          cp build/app/outputs/flutter-apk/app-release.apk ApiLab_Android_Universal.apk
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk ApiLab_Android_Intel_x86_64.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ApiLab_Android_arm64.apk
          fi

      - name: Upload Android Artifacts
        if: steps.check_android.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ApiLab_Android*

  publish-release:
    name: Create GitHub Release & Upload Assets
    needs: [build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Set Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d '[:space:]')
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: API Lab ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
