name: Build and Release Desktop Apps

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. macOS Builds (Apple Silicon & Intel)
  # ==========================================
  build-macos-arm64:
    name: macOS (Apple Silicon ARM64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: 'arm64'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS App (ARM64)
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release

      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../api_lab-macos-arm64.zip api_lab.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api_lab-macos-arm64
          path: api_lab-macos-arm64.zip
          retention-days: 5

  build-macos-intel-x64:
    name: macOS (Intel x86_64)
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: 'x64'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS App (Intel x64)
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release

      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../api_lab-macos-intel-x64.zip api_lab.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api_lab-macos-intel-x64
          path: api_lab-macos-intel-x64.zip
          retention-days: 5

  # ==========================================
  # 2. Windows Build (x64)
  # ==========================================
  build-windows-x64:
    name: Windows (Intel/AMD64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: 'x64'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App (x64)
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Package Windows App
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath api_lab-windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api_lab-windows-x64
          path: api_lab-windows-x64.zip
          retention-days: 5

  # ==========================================
  # 3. Linux Builds (x64 & ARM64)
  # ==========================================
  build-linux-x64:
    name: Linux (Intel/AMD64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: 'x64'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux App (x64)
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Package Linux App
        run: |
          cd build/linux/x64/release
          tar -czvf ../../../../api_lab-linux-x64.tar.gz bundle/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api_lab-linux-x64
          path: api_lab-linux-x64.tar.gz
          retention-days: 5

  build-linux-arm64:
    name: Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev git curl

      - name: Install Flutter via Git (Native Linux ARM64)
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          $HOME/flutter/bin/flutter config --no-analytics
          $HOME/flutter/bin/flutter precache --linux

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux App (ARM64)
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Package Linux App
        run: |
          cd build/linux/arm64/release
          tar -czvf ../../../../api_lab-linux-arm64.tar.gz bundle/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api_lab-linux-arm64
          path: api_lab-linux-arm64.tar.gz
          retention-days: 5

  # ==========================================
  # 4. GitHub Release Publisher
  # ==========================================
  publish-release:
    name: Publish Release & Distribute Binaries
    needs:
      - build-macos-arm64
      - build-macos-intel-x64
      - build-windows-x64
      - build-linux-x64
      - build-linux-arm64
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' \r\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-assets
          merge-multiple: true

      - name: Check release assets
        id: check_assets
        run: |
          mkdir -p release-assets
          COUNT=$(find release-assets -type f | wc -l)
          echo "Found $COUNT files in release-assets"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_files=true" >> $GITHUB_OUTPUT
            ls -la release-assets
          else
            echo "has_files=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        if: steps.check_assets.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "ApiLab Release v${{ steps.get_version.outputs.version }}"
          body: |
            ## ApiLab Desktop Release v${{ steps.get_version.outputs.version }}
            
            Automated multi-platform desktop release built from commit `${{ steps.get_version.outputs.short_sha }}` on branch `${{ github.ref_name }}`.

            ### Included Desktop Binaries:
            - **macOS (Apple Silicon M1/M2/M3/M4)**: `api_lab-macos-arm64.zip`
            - **macOS (Intel x86_64)**: `api_lab-macos-intel-x64.zip`
            - **Windows (x64 Intel/AMD)**: `api_lab-windows-x64.zip`
            - **Linux (x64 Intel/AMD)**: `api_lab-linux-x64.tar.gz`
            - **Linux (ARM64)**: `api_lab-linux-arm64.tar.gz`

            ### Features:
            - Intercept and inspect real-time HTTP/HTTPS requests and responses.
            - Built-in Mock Project and Rule management with custom variables and conditional logic.
            - Integrated Model Context Protocol (MCP) server supporting Streamable HTTP (`/mcp`) and SSE (`/sse`) on port 8765.
          files: release-assets/*
          draft: false
          prerelease: false
